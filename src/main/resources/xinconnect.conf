# ============================================================================
# XinConnect 通用元插件配置
# 首次运行时会自动生成到 xinbot 的 config.conf 同目录,请按你的服务器修改。
# ----------------------------------------------------------------------------
# 顶层结构:
#   connection  要连接的服务器地址(通用元插件的唯一"连接层"职责)
#   credentials 登录用到的凭据,可在规则里用 {{password}} 等引用
#   variables   任意自定义变量,同样可在规则里用 {{名字}} 引用
#   debug       true 时打印每条收到的信号与跳过原因,便于编写规则
#   templates   选用内置登录流程模板(会自动展开成规则),见文末列表
#   rules       你自定义的登录规则链:命中 when -> 顺序执行 actions
#   (templates 与 rules 会合并,统一按 priority 排序评估)
#
# 规则条件(when)可用字段:
#   types        信号来源数组:SYSTEM_CHAT / PUBLIC_CHAT / PRIVATE_CHAT / OVERLAY / SERVER_CHANGE / WINDOW_OPEN
#                (WINDOW_OPEN 的 text 为菜单标题,适合用 contains/regex 匹配特定菜单)
#   contains     文本包含任意其一即命中(默认忽略大小写,可用 ignoreCase 关闭)
#   notContains  文本包含其中任一则不命中
#   equals       文本全等
#   startsWith   文本前缀
#   regex        正则 find;捕获组以 {{g1}} {{g2}} ... 注入动作
#   stage        仅当当前阶段属于该数组时命中(状态机)
#   notStage     当前阶段若属于该数组则不命中(如排除已登录 LOGGED_IN)
#   sender       发送者名匹配(仅 PUBLIC/PRIVATE_CHAT)
#   overlay      仅匹配 actionbar(true)/聊天(false)
#   all/any/not  组合子条件
#
# 规则动作(actions,按序执行;字符串支持 {{变量}} 插值):
#   command = "login {{password}}"   发送命令(可带或不带前导 /)
#   chat    = "hello"                发送聊天消息
#   stage   = "LOGGED_IN"            切换阶段
#   setVariable = { key = "value" }  写入会话变量
#   log     = "文本"                 打印日志
#   tab     = "msg {{sender}}"       命令 Tab 补全请求(让服务器回送可用命令/参数)
#   custom  = "名称"                 预留:自定义动作(暂未执行)
#   —— 物品/容器交互(需已连接且处于游戏状态,否则该动作自动跳过)——
#   useItem       = "MAIN_HAND"      使用手持物品(MAIN_HAND/OFF_HAND),如"点物品离开排队"
#   selectSlot    = 0                选择快捷栏槽位(0-8)
#   closeContainer = 0               关闭容器/菜单(0=玩家背包)
#   containerButton = { containerId = 0, button = 1 }               点击容器按钮
#   containerClick  = { containerId = 1, slot = 13, button = 0 }    点击容器槽位(button:0左键/1右键)
#   可用插值变量:credentials/variables 中的键,外加 {{text}} {{sender}}
#                {{stage}} {{type}} {{overlay}} 以及正则捕获 {{g1}}...
#                {{containerId}} = 最近一次打开的菜单/容器窗口 id(由 WINDOW_OPEN 自动记录)
#   注:containerClick 以"尽力而为"方式发送(不跟踪真实 stateId/背包),
#       适用于服务端托管的登录/排队菜单;对严格校验 stateId 的原生容器可能失败。
#
# 规则修饰:
#   priority     越小越先评估(默认 100)
#   once         整场会话仅触发一次(默认 false)
#   cooldownMs   两次触发最小间隔毫秒(默认 0)
#   stopOnMatch  命中后终止后续规则(默认 false)
#
# 内置模板(templates 可填其一,运行 xinconnect templates 也可查询):
#   authme               AuthMe 类:/login、/register、登录完成置 LOGGED_IN
#   register-then-login  先按邮箱 /register 再 /login 的流程
#   join-login-fallback  进服后兜底补发一次 /login(未登录时)
#   queue-join-item      排队时选中原物品槽并使用主手物品(点击物品离开排队)
# ============================================================================

connection {
  host = "play.example.net"
  port = 25565
}

credentials {
  # 用于 /login 或 /register 的密码
  password = "yourPassword"
  # 部分服务器 /register 需要邮箱
  email = ""
}

variables {
  # 其它你想在规则里引用的常量
}

# 开启后可用 xinconnect try / 观察日志来调试规则匹配
debug = false

# 直接选用内置模板,大多数服务器只改 host + password 即可跑通
templates = ["authme"]

rules = [

  # ------------------------------------------------------------------
  # 自定义示例:排队位次提示(正则捕获组),仅打印不发消息。
  # 若你的服务器有特殊登录流程,照此追加规则即可,无需改代码。
  # ------------------------------------------------------------------
  {
    id = "queue-info"
    priority = 30
    cooldownMs = 10000
    when {
      types = ["SYSTEM_CHAT", "OVERLAY"]
      regex = "(?i)position[: ]+(\\d+).*queue"
    }
    actions = [
      { setVariable = { queuePos = "{{g1}}" } },
      { log = "当前排队位次:{{g1}}" }
    ]
  }

  # ------------------------------------------------------------------
  # 自定义示例:菜单交互。服务器打开标题含"选择/ kits"的菜单时,
  # 自动点击其中某个槽位。containerId 省略时会自动用当前窗口 id。
  # ------------------------------------------------------------------
  {
    id = "pick-menu-item"
    priority = 35
    once = true
    when {
      types = ["WINDOW_OPEN"]
      contains = ["选择", "Select", "Kit"]
    }
    actions = [
      { containerClick = { slot = 11, button = 0 } }
    ]
  }

]
